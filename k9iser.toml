#
# k9iser manifest for empty-linter
# Negative-space diagnostics with a Bun audit runtime

[project]
name = "empty-linter"
safety_tier = "hunt"

[[source]]
path = "package.json"
type = "json"
output = "generated/k9iser/bun-package.k9"

[[source]]
path = "Justfile"
type = "justfile"
output = "generated/k9iser/justfile-recipes.k9"

[[source]]
path = ".github/workflows/hypatia-scan.yml"
type = "workflow"
output = "generated/k9iser/ci-security.k9"

[[constraint]]
rule = "build.dependencies has no banned_packages"
severity = "error"

[[constraint]]
rule = "runtime is bun"
severity = "error"
