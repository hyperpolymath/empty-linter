# SonarCloud / SonarQube Cloud analysis configuration.
#
# Exclude the generated Bun bundle: its reviewed AffineScript source remains in
# scope, while analysing both representations duplicates findings and assigns
# source-level fixes to generated output. Also exclude the Hypatia workflow
# wrapper from analysis. Its only Sonar
# finding is the `secrets: inherit` Security Hotspot, and that construct
# is REQUIRED by hyperpolymath/standards hypatia-scan-reusable.yml: the
# reusable consumes ${{ secrets.HYPATIA_DISPATCH_PAT }} but does not
# declare it as a workflow_call secret, so `secrets: inherit` is the only
# way to pass it through (needed by the gitbot-fleet Phase 2 learning
# submission). The file is a thin, SHA-pinned wrapper with no other code
# to analyse, so excluding it loses no meaningful coverage.
#
# NOTE: this repo currently uses SonarQube Cloud Automatic Analysis, which
# reads the corresponding exclusions from .sonarcloud.properties. This file
# retains the same scope for a future CI-based scanner; keeping the two modes
# explicit avoids silently configuring the inactive analysis method.
sonar.exclusions=.github/workflows/hypatia-scan.yml,src/core/ByteDetector.bun.js
